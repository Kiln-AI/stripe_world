# uv's build backend, the one Seahaven itself is built with. Every file under
# `src/seahaven_stripe_world` travels into the wheel, not only the `.py` ones, so `schema/*.sql`
# reaches `importlib.resources` in an installed world. `fixtures/` is outside the
# package and deliberately does not travel: a fixture is a checkout's file.
[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[project]
name = "seahaven-stripe-world"
version = "0.1.0"
description = "StripeAPI: a Seahaven world — a faithful, stateful replica of Stripe's Billing and Payments core. Not affiliated with Stripe."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.14"
dependencies = ["seahaven~=0.6"]

# The server and its client. Left out of the default install because openenv's
# own dependency tree is large, and a world used in process never needs it.
[project.optional-dependencies]
serve = ["seahaven[serve]"]
mcp = ["seahaven[mcp]"]
# `serve_http.py`: this world's Stripe HTTP API under `seahaven.http`, which
# needs Starlette and uvicorn and nothing else. Named apart from `serve` because
# that one is openenv, which cannot import on 3.14 and conflicts with `mcp`.
http = ["starlette>=0.47", "uvicorn>=0.35"]

[dependency-groups]
# `stripe` is the conformance recorder's transport and nothing else: the test
# suite replays committed cassettes and never imports it
# (components/conformance.md Dependencies, enforced by a static test).
#
# The `http` extra and `httpx` are here so that a checkout's plain `uv run
# serve_http.py` and `uv run pytest` have the HTTP server and its test client
# (`tests/http_api/`); `stripe` also drives those tests' SDK smoke test, offline
# against a local server.
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "ty>=0.0.1a21",
    "stripe>=13",
    "httpx>=0.28",
    "seahaven-stripe-world[http]",
]

[tool.uv]
conflicts = [[{ extra = "serve" }, { extra = "mcp" }]]
# SEAHAVEN_FINDINGS.md Entry 1: the framework's pydantic>=2.13.5 floor crashes
# `import seahaven` on the 3.14.0rc builds some environments resolve to, and
# 2.12.3 is the version every suite here has been green on. An override rather
# than a constraint, because a constraint cannot lower a dependency's own floor.
# Revisit on a confirmed final-3.14 + fixed lock combination.
override-dependencies = ["pydantic==2.12.3"]

# It matches `[project] name` normalised, and has to: the CLI and the pytest
# plugin find the world by importing the package that name normalises to
# (`seahaven.cli.discover`), so a distribution name that is not the package name
# is a world neither can find (`SEAHAVEN_FINDINGS.md` Entry 7).
[tool.uv.build-backend]
module-name = "seahaven_stripe_world"

[tool.ruff]
line-length = 100
src = ["src", "tests", "fixtures_src", "tools_dev"]
# The committed specs and research are point-in-time documents whose Python
# fragments are prose, not code; a frozen fixture is a binary artifact.
extend-exclude = ["specs", "research", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests", "fixtures_src", "tools_dev"]

[tool.ty.environment]
# `tools_dev/record.py` and the scenario DSL import the cassette format from
# `tests/conformance/` (the recorder's dump pipeline and the replayer share
# one format module); pytest puts `tests/` on the path via the root conftest,
# and this gives ty the same root.
extra-paths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import `tools_dev` (the build-time generator,
# which is not installed) alongside the installed `seahaven_stripe_world` package.
pythonpath = ["."]
# No `--seahaven-world`: the distribution normalises to the package, so the
# plugin's project-name heuristic finds the world on its own.
addopts = "-q"
