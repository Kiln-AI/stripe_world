name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      # `--locked` and not a bare sync: it fails if `uv.lock` does not match
      # `pyproject.toml`, so a dependency change that forgot its `uv lock` is
      # caught here instead of resolving to something nobody reviewed. No
      # `--extra serve`: nothing in this repo's suites needs it. The
      # `http` extra is what `serve_http.py` and `tests/http_api/` run on (the
      # dev group carries it too; named here so dropping it from the group
      # cannot quietly skip those tests).
      - name: Install the project
        run: uv sync --locked --extra http

      - name: Format
        run: uv run --no-sync ruff format --check

      - name: Lint
        run: uv run --no-sync ruff check

      - name: Types
        run: uv run --no-sync ty check

      - name: Tests
        run: uv run --no-sync pytest

      # The framework's own lints over this world: schema, fixtures, tool
      # signatures and the rest. No `--world`: the distribution name normalises
      # to the package, which is what the CLI's project-name heuristic imports.
      - name: World check
        run: uv run --no-sync seahaven check
